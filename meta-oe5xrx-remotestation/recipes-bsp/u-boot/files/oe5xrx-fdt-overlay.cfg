# Boot stage 2 (/boot/boot-stage2.scr in the A/B slot) applies the slot's DT
# overlays to a copy of the firmware DTB with `fdt move/resize/apply`.
# `fdt apply` needs libfdt overlay support; both are asserted in the built
# .config by the guard in u-boot_%.bbappend (fragments can be dropped silently).
CONFIG_CMD_FDT=y
CONFIG_OF_LIBFDT_OVERLAY=y
