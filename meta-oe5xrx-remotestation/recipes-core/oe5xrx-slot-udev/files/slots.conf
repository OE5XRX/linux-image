# OE5XRX slot -> USB port-path map (real HW). Single source of truth.
#
# The BusBoard FE1.1s hub ports are fixed-wired: hub port N = slot N. A module is
# identified by PORT PATH only (never serial — two identical modules must be told
# apart by where they sit). Consumers:
#   * 90-oe5xrx-slots.rules (udev) — same mapping, hardcoded per line; the CI
#     test tests/ota-integration/test_module_flash_static.py fails if the two drift.
#   * station_agent module-firmware flash — `dfu-util -p <port>` addresses the
#     slot's module even while it sits in the DFU bootloader (no ttyACM then, so
#     the port can't be derived from /dev/oe5xrx/slotN/control at that point).
#
# Format: one `slot<N>=<usb-port-path>` per line; `#` comments and blank lines
# are ignored. Parseable by POSIX sh (`. slots.conf`) and trivially by Python.
slot1=1-1.1
slot2=1-1.2
slot3=1-1.3
slot4=1-1.4
