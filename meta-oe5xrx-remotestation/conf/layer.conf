# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-oe5xrx-remotestation"
BBFILE_PATTERN_meta-oe5xrx-remotestation = "^${LAYERDIR}/"
# Priority 15 is above meta-raspberrypi (9) and meta-openembedded (typ. 7)
# so our bbappends (e.g. base-files_%.bbappend) run AFTER theirs.
BBFILE_PRIORITY_meta-oe5xrx-remotestation = "15"

LAYERDEPENDS_meta-oe5xrx-remotestation = "core"
LAYERSERIES_COMPAT_meta-oe5xrx-remotestation = "wrynose"

# RPi-only appends (the linux-raspberrypi 6.18 kernel pin) live under
# dynamic-layers/raspberrypi and are parsed ONLY when the raspberrypi layer
# collection is present (i.e. the RPi build). Otherwise a version-specific
# bbappend with no matching recipe is a fatal dangling-append error on the
# qemux86-64 build (bitbake 2.18 removed BB_DANGLINGAPPENDS_WARNONLY, so it
# can no longer be downgraded to a warning).
BBFILES_DYNAMIC += "raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bbappend"
