# OE5XRX FM-sink unity anchor — WirePlumber ALSA device rule.
#
# Root cause: the upstream WirePlumber default device.routes.default-sink-volume
# is 0.064 (cubic), which wpctl reports as "vol: 0.40". Both the FM-Transceiver
# sink and the Built-in sink default to 0.40 on first connect (no saved route
# state), because apply-routes.lua falls back to this global default.
#
# Fix: anchor the FM Transceiver ALSA card device to
# device.routes.default-sink-volume = 1.0 (unity) via a per-device property
# override. apply-routes.lua reads this property BEFORE the global WirePlumber
# setting, so the FM sink gets volume 1.0 on first activation. WirePlumber then
# saves 1.0 into its route state DB, so the level persists across reboots.
#
# Scope: ONLY the FM Transceiver Board (USB 2fe3:0012, device.name prefix
# alsa_card.usb-OE5XRX_FM_Transceiver_Board.*). Built-in Audio and other
# devices are NOT touched.
#
# Limitation: this default-anchor only takes effect when no saved route state
# exists for the device (fresh image / data-partition wipe). Existing stations
# with a persisted 0.40 level need a one-time WirePlumber state clear to pick
# up the new default.
monitor.alsa.rules = [
    {
        matches = [
            { device.name = "~alsa_card.usb-OE5XRX_FM_Transceiver_Board.*" }
        ]
        actions = {
            update-props = {
                device.routes.default-sink-volume = 1.0
            }
        }
    }
]
