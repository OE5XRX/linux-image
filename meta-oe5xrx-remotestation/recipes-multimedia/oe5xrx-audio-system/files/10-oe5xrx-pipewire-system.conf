# OE5XRX system-wide PipeWire tuning (drop-in, merged over pipewire.conf).
# Headless remote-station appliance — see Spec 0 §2.7 / §3.
context.properties = {
    # Run as the system daemon (also set by stock pipewire.conf; explicit here so
    # the intent is unfalsifiable in a system-mode deployment).
    core.daemon = true
    core.name   = pipewire-0

    # A fixed 48 kHz graph clock. Each module node is resampled from its native
    # rate (FM sim = 8 kHz mono) to the negotiated stream rate by PipeWire, so
    # the graph rate is independent of any module — 48 kHz is a safe superset.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 44100 16000 8000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 8192
}
