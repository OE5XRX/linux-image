# OE5XRX slot-audio naming (Spec 0 §4/§8) — WirePlumber ALSA monitor rules.
#
# The stable identity the agent (Session B) targets is the PipeWire NODE NAME
# `oe5xrx.slotN` (RX source) / `oe5xrx.slotN.tx` (TX sink). This drop-in renames
# the auto-created snd-aloop nodes in the SIM. Real HW is handled agent-side, not
# here — see the "Real HW" note at the bottom (Spec 0 §12 / Finding 2).
#
# snd-aloop topology (one card, two PCM devices cross-wired as two cables):
#   Cable A (RX): dev0 playback  ->  dev1 capture
#   Cable B (TX): dev1 playback  ->  dev0 capture
# Ownership (no PCM is opened by two owners -> no -EBUSY):
#   dev0 playback : the tone shim (raw ALSA hw open, 1 kHz)     -> feeds cable A
#   dev1 capture  : PipeWire node oe5xrx.slot1     (RX source)  <- cable A  [tap]
#   dev1 playback : PipeWire node oe5xrx.slot1.tx  (TX sink)    -> feeds cable B
#   dev0 capture  : the TX self-check (raw ALSA hw open)        <- cable B  [tap]
# So PipeWire owns ONLY the two dev1 nodes; both dev0 nodes are disabled here.
#
# 8 kHz mono S16_LE (Spec 0 §8/§12): the dev1 nodes are pinned to the real UAC2
# module format so the aloop cables run at 8 kHz (matching the raw 8 k shim/tap)
# and the PipeWire graph (48 kHz, allowed-rates=[48000]) exercises the real
# 8 k<->48 k resample path.
#
# NOTE (first-boot verification point): the exact ALSA node property strings
# (api.alsa.pcm.device, the alsa_input/alsa_output node.name prefixes, the
# audio.rate/format pinning) are confirmed against the running PipeWire 1.6.8 by
# the QEMU okay-gate (test_audio.py), which dumps `wpctl status` on a miss — so
# any mismatch surfaces loudly, never as a silent/false pass.
monitor.alsa.rules = [
    # ----- sim: expose raw per-PCM nodes (not a merged ACP profile) so the two
    # snd-aloop cable ends are individually addressable by api.alsa.pcm.device.
    {
        matches = [
            { device.name = "~alsa_card.*snd_aloop.*" }
        ]
        actions = {
            update-props = {
                api.alsa.use-acp = false
            }
        }
    }
    # ----- sim RX source: cable-A tap = device 1 capture -> oe5xrx.slot1.
    {
        matches = [
            { node.name = "~alsa_input.*snd_aloop.*", api.alsa.pcm.device = "1" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1"
                node.nick        = "OE5XRX slot1 RX"
                node.description = "OE5XRX slot1 audio RX (capture / source)"
                audio.rate       = 8000
                audio.channels   = 1
                audio.format     = "S16LE"
                priority.driver  = 1000
                priority.session = 1000
            }
        }
    }
    # ----- sim TX sink: cable-B source = device 1 playback -> oe5xrx.slot1.tx.
    # What Session B (or the self-check) plays here appears on the dev0 capture.
    {
        matches = [
            { node.name = "~alsa_output.*snd_aloop.*", api.alsa.pcm.device = "1" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1.tx"
                node.nick        = "OE5XRX slot1 TX"
                node.description = "OE5XRX slot1 audio TX (playback / sink)"
                audio.rate       = 8000
                audio.channels   = 1
                audio.format     = "S16LE"
            }
        }
    }
    # ----- sim: device 0 is owned by the raw ALSA shim/tap (playback = tone shim,
    # capture = TX self-check). Keep PipeWire off BOTH so it never contends.
    {
        matches = [
            { node.name = "~alsa_output.*snd_aloop.*", api.alsa.pcm.device = "0" }
        ]
        actions = { update-props = { node.disabled = true } }
    }
    {
        matches = [
            { node.name = "~alsa_input.*snd_aloop.*", api.alsa.pcm.device = "0" }
        ]
        actions = { update-props = { node.disabled = true } }
    }

    # ----- Real HW: intentionally NO WirePlumber rename rule.
    # Spec 0 §12 / Finding 2 (data-backed on the bench module, USB 2fe3:0012 on
    # hub port 1-1.3 = slot3): PipeWire derives node.name from the ALSA by-id
    # (usb-OE5XRX_FM_Transceiver_Board_<serial>-03), which carries the SERIAL, not
    # the USB port path — so a per-port regex like "usb.*1\.1" can never match
    # (proven broken on real HW). Instead the agent (Session B) maps slot -> node
    # via the OE5XRX_SLOT udev tag (set by 90-oe5xrx-slots.rules) -> ALSA card
    # index -> api.alsa.card, the SAME mechanism it already uses for slotN/control.
    # The sim tags the aloop card OE5XRX_SLOT=1, so sim and real resolve identically.
]
