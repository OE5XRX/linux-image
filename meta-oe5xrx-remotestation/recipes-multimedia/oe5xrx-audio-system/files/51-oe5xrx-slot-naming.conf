# OE5XRX slot-audio naming (Spec 0 §4) — WirePlumber ALSA monitor rules.
#
# ALSA devices can't carry a stable /dev symlink the way the control tty does,
# so the *stable identity the agent (Session B) targets is the PipeWire NODE
# NAME* `oe5xrx.slotN`. This drop-in renames the auto-created ALSA nodes:
#   capture  side -> oe5xrx.slotN       (RX source / tap)
#   playback side -> oe5xrx.slotN.tx    (TX sink)
#
# Sim vs real resolve to the SAME node name (Spec 0 §8):
#   * Sim  : the snd-aloop card (loaded by the sim-harness) — matched by its
#            node path 'snd_aloop'. This is the CI-proven half.
#   * Real : the module's UAC2 card behind a fixed FE1.1s hub port — matched by
#            USB bus-path. Bench-verified half (parallels the control tty rule).
monitor.alsa.rules = [
    # ----- slot1 : sim (snd-aloop) -----------------------------------------
    {
        matches = [
            { node.name = "~alsa_input.*snd_aloop.*" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1"
                node.nick        = "OE5XRX slot1 RX"
                node.description = "OE5XRX slot1 audio RX (capture / source)"
                priority.driver  = 1000
                priority.session = 1000
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_output.*snd_aloop.*" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1.tx"
                node.nick        = "OE5XRX slot1 TX"
                node.description = "OE5XRX slot1 audio TX (playback / sink)"
            }
        }
    }

    # ----- slot1 : real HW (UAC2 behind hub port 1-1.1) --------------------
    # Bench-verified later; inert in sim (no matching USB node). The bus-path
    # token '1.1' is the FE1.1s hub port = slot1 (see 90-oe5xrx-slots.rules).
    {
        matches = [
            { node.name = "~alsa_input.*usb.*1\.1.*" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1"
                node.nick        = "OE5XRX slot1 RX"
                node.description = "OE5XRX slot1 audio RX (capture / source)"
                priority.driver  = 1000
                priority.session = 1000
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_output.*usb.*1\.1.*" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1.tx"
                node.nick        = "OE5XRX slot1 TX"
                node.description = "OE5XRX slot1 audio TX (playback / sink)"
            }
        }
    }
]
