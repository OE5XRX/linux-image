# OE5XRX slot-audio naming (Spec 0 §4) — WirePlumber ALSA monitor rules.
#
# ALSA devices can't carry a stable /dev symlink the way the control tty does,
# so the stable identity the agent (Session B) targets is the PipeWire NODE NAME
# `oe5xrx.slotN`. This drop-in renames the auto-created ALSA node.
#
# Sim vs real resolve to the SAME node name (Spec 0 §8):
#   * Sim  : the snd-aloop card (loaded by the sim-harness). snd-aloop exposes
#            TWO PCM devices cross-wired as a cable: playback of device 0 <-> the
#            capture of device 1. The tone shim writes the 1 kHz sine to
#            hw:<card>,0,0 (device 0 playback), so the tone appears on the
#            *device 1 capture* — that is the RX tap we name oe5xrx.slot1. Because
#            the shim owns device 0 playback via a raw ALSA hw open while PipeWire
#            owns device 1 capture, they use DIFFERENT PCM devices — no -EBUSY
#            contention. We also disable PipeWire's device 0 playback node so it
#            never fights the shim for that PCM.
#   * Real : the module's UAC2 card behind a fixed FE1.1s hub port — matched by
#            USB bus-path. Bench-verified half (parallels the control tty rule).
#
# NOTE (first-boot verification point): the exact ALSA node property strings
# (api.alsa.pcm.device, the alsa_input/alsa_output node.name prefixes) are the
# one thing that must be confirmed against the running PipeWire 1.6.8 build —
# the QEMU okay-gate (test_audio.py) prints `wpctl status` on a miss so any
# mismatch surfaces immediately with the real node names.
monitor.alsa.rules = [
    # ----- sim: expose raw per-PCM nodes (not a merged ACP profile) so the two
    # snd-aloop cable ends are individually addressable by api.alsa.pcm.device.
    {
        matches = [
            { device.name = "~alsa_card.*snd_aloop.*" }
        ]
        actions = {
            update-props = {
                api.alsa.use-acp = false
            }
        }
    }
    # ----- sim: the tone-fed RX tap = device 1 capture -> oe5xrx.slot1.
    {
        matches = [
            { node.name = "~alsa_input.*snd_aloop.*", api.alsa.pcm.device = "1" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1"
                node.nick        = "OE5XRX slot1 RX"
                node.description = "OE5XRX slot1 audio RX (capture / source)"
                priority.driver  = 1000
                priority.session = 1000
            }
        }
    }
    # ----- sim: device 0 playback is driven directly by the tone shim's raw ALSA
    # hw open; keep PipeWire off it so the two never contend for the same PCM.
    {
        matches = [
            { node.name = "~alsa_output.*snd_aloop.*", api.alsa.pcm.device = "0" }
        ]
        actions = {
            update-props = {
                node.disabled = true
            }
        }
    }

    # ----- real HW: UAC2 capture/playback behind hub port 1-1.1 (= slot1).
    # Bench-verified later; inert in sim (no matching USB node).
    {
        matches = [
            { node.name = "~alsa_input.*usb.*1\.1.*" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1"
                node.nick        = "OE5XRX slot1 RX"
                node.description = "OE5XRX slot1 audio RX (capture / source)"
                priority.driver  = 1000
                priority.session = 1000
            }
        }
    }
    {
        matches = [
            { node.name = "~alsa_output.*usb.*1\.1.*" }
        ]
        actions = {
            update-props = {
                node.name        = "oe5xrx.slot1.tx"
                node.nick        = "OE5XRX slot1 TX"
                node.description = "OE5XRX slot1 audio TX (playback / sink)"
            }
        }
    }
]
