# Audio simulation substrate (Spec 0 §8): snd-aloop is the in-guest ALSA
# loopback that stands in for the module's real UAC2 device under QEMU/CI.
# The sim-harness loads it, drives a 1 kHz tone into the playback side, and the
# capture side becomes the slot's RX tap — indistinguishable to PipeWire/agent
# from a real UAC2 capture. Only the qemux86-64 (Proxmox/CI) image needs this;
# real hardware uses snd-usb-audio (UAC2) instead.
#
# Base ALSA must be present for the loopback (and, on real HW, for UAC2). Built
# as a module so it is loaded on demand by the sim-harness (never on real HW).
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_PCM=y
CONFIG_SND_ALOOP=m
