# PowerBoard power monitors (2x TI INA226 on i2c1, DT overlay oe5xrx-ina226).
# bcm2711_defconfig already has this as a module; pin it explicitly so a
# defconfig change cannot silently drop the station's PSU telemetry. The
# module autoloads from the overlay's "ti,ina226" compatible (OF modalias).
CONFIG_HWMON=y
CONFIG_SENSORS_INA2XX=m
