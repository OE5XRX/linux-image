header:
  version: 15

distro: poky

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    # bitbake is the build tool, not a layer; empty mapping tells kas to add
    # no layers from this repo (omitting the key would add the repo root as a
    # layer -> "bitbake/conf/layer.conf not found").
    layers: {}

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-oe5xrx-remotestation:
    layers:
      meta-oe5xrx-remotestation:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    INIT_MANAGER = "systemd"
    # Pin the kernel series so version/ext4-format drift is deliberate, not
    # silent. Kernel-in-rootfs A/B makes drift safe; this makes it intentional.
    # Both providers are pinned: x86 uses linux-yocto, RPi uses linux-raspberrypi.
    PREFERRED_VERSION_linux-yocto = "6.18.%"
    PREFERRED_VERSION_linux-raspberrypi = "6.18.%"
    # Shared build cache (Spec: 2026-08-01-shared-sstate-mirror). The mount at
    # /mnt/yocto-shared is a Hetzner Storage Box shared by CI, the interactive
    # build box (Spec 2) and local dev. Read-mirror + push model:
    #   - SSTATE_DIR stays LOCAL/fast (network sstate writes are brutally slow).
    #   - SSTATE_MIRRORS reads prebuilt artifacts from the box (when mounted).
    #   - DL_DIR is the shared downloads dir on the box (bitbake locks per file).
    # CI rsyncs the local sstate delta up to the box after each build.
    # No mount (local dev without the box) -> local dirs, no mirror. Use
    # os.path.ismount (NOT isdir): the mountpoint directory can exist without
    # the Storage Box being mounted (e.g. a stale/failed mount), which would
    # otherwise silently write downloads to local disk and enable the mirror.
    DL_DIR ?= "${@'/mnt/yocto-shared/downloads' if os.path.ismount('/mnt/yocto-shared') else '${TOPDIR}/downloads'}"
    SSTATE_DIR ?= "${TOPDIR}/sstate-cache"
    SSTATE_MIRRORS ?= "${@'file://.* file:///mnt/yocto-shared/sstate/PATH;downloadfilename=PATH' if os.path.ismount('/mnt/yocto-shared') else ''}"
    # Deterministic task hashes so the SHARED sstate mirror matches ACROSS
    # builds. The default local hash-equivalence server (BB_HASHSERVE "auto")
    # computes per-build unihashes that never line up with a mirror populated by
    # another build -> "no sstate will match from the mirror". Disable it so
    # every OE5XRX build produces mutually-matchable sstate. A shared hashserv
    # (BB_HASHSERVE = "host:port") is the higher-reuse alternative -> Spec 3.
    BB_HASHSERVE = ""
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    # Shallow git fetch: only the lockfile-pinned commit, not full history
    # (the linux-yocto --mirror clone was multi-GB / 85+ min over sshfs).
    BB_GIT_SHALLOW = "1"

# Environment variables kas forwards into the bitbake invocation. kas
# scrubs the shell env by default, so setting OE5XRX_RELEASE_TAG at the
# workflow level alone does nothing — it has to be listed here.
#
# Format: `NAME: default`. If the variable is set in the parent
# environment (e.g. by release.yml -> build.yml) that value wins; else
# the default below is used (covers local `kas build`).
env:
  OE5XRX_RELEASE_TAG: "dev"

target:
  - oe5xrx-remotestation-image
