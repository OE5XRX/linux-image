header:
  version: 15

distro: poky

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    # bitbake is the build tool, not a layer; empty mapping tells kas to add
    # no layers from this repo (omitting the key would add the repo root as a
    # layer -> "bitbake/conf/layer.conf not found").
    layers: {}

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      # meta-filesystems provides sshfs-fuse (dev-image live-mount, Fast-Dev-Loop).
      # LAYERDEPENDS = core openembedded-layer networking-layer — all already enabled.
      meta-filesystems:
      # meta-multimedia provides PipeWire, WirePlumber and the GStreamer PipeWire
      # elements for the audio subsystem (Spec 0 §3/§7-A). LAYERDEPENDS = core
      # openembedded-layer meta-python networking-layer — all already enabled above.
      meta-multimedia:

  meta-oe5xrx-remotestation:
    layers:
      meta-oe5xrx-remotestation:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    INIT_MANAGER = "systemd"
    # Pin the kernel series so version/ext4-format drift is deliberate, not
    # silent. Kernel-in-rootfs A/B makes drift safe; this makes it intentional.
    # Both providers are pinned: x86 uses linux-yocto, RPi uses linux-raspberrypi.
    PREFERRED_VERSION_linux-yocto = "6.18.%"
    PREFERRED_VERSION_linux-raspberrypi = "6.18.%"
    # Public read-only build cache on Cloudflare R2 (Spec 4:
    # 2026-08-24-spec4-r2-public-sstate-mirror). Anyone reads anonymously over
    # HTTPS; trusted builders (CI + build server) publish new objects via the
    # S3 API after the build (see build.yml / ydev remote-build). No shared
    # filesystem, no sshfs — SSTATE_DIR/DL_DIR are LOCAL.
    DL_DIR ?= "${TOPDIR}/downloads"
    SSTATE_DIR ?= "${TOPDIR}/sstate-cache"
    SSTATE_MIRRORS ?= "file://.* https://sstate.oe5xrx.org/sstate/PATH;downloadfilename=PATH"
    # Read-only public source premirror; own-mirrors keeps upstream as fallback.
    INHERIT += "own-mirrors"
    SOURCE_MIRROR_URL ?= "https://sstate.oe5xrx.org/downloads/"
    # Deterministic task hashes so mirror objects match ACROSS builds. Default
    # hash-equivalence (BB_HASHSERVE "auto") computes per-build unihashes that
    # never line up with a mirror populated by another build. A shared hashserv
    # was evaluated and deferred (marginal benefit vs always-on cost).
    BB_HASHSERVE = ""
    BB_SIGNATURE_HANDLER = "OEBasicHash"
    # Shallow git fetch: only the lockfile-pinned commit, not full history.
    BB_GIT_SHALLOW = "1"

# Environment variables kas forwards into the bitbake invocation. kas
# scrubs the shell env by default, so setting OE5XRX_RELEASE_TAG at the
# workflow level alone does nothing — it has to be listed here.
#
# Format: `NAME: default`. If the variable is set in the parent
# environment (e.g. by release.yml -> build.yml) that value wins; else
# the default below is used (covers local `kas build`).
env:
  OE5XRX_RELEASE_TAG: "dev"

target:
  - oe5xrx-remotestation-image
