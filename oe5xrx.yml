header:
  version: 15

distro: poky

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    # bitbake is the build tool, not a layer; empty mapping tells kas to add
    # no layers from this repo (omitting the key would add the repo root as a
    # layer -> "bitbake/conf/layer.conf not found").
    layers: {}

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      # meta-filesystems provides sshfs-fuse (dev-image live-mount, Fast-Dev-Loop).
      # LAYERDEPENDS = core openembedded-layer networking-layer — all already enabled.
      meta-filesystems:

  meta-oe5xrx-remotestation:
    layers:
      meta-oe5xrx-remotestation:

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    INIT_MANAGER = "systemd"
    # Kernel version follows the pinned Yocto-release default — no manual
    # PREFERRED_VERSION override. Reproducibility now comes from oe5xrx.lock.yml
    # (pins every layer commit), so the "default" is itself frozen; the override
    # was redundant maintenance. During the 2026-07-29 build (with the old 6.18.%
    # pin) the release resolved to linux-yocto 6.18.35; the next build validates
    # what the un-overridden default resolves to. Revert here if it regresses.
    # Persistent cache on Hetzner Volume (mounted at /mnt/yocto-cache in CI).
    # Falls back to build/ local dirs if the mount doesn't exist (local dev).
    DL_DIR ?= "${@'/mnt/yocto-cache/downloads' if os.path.isdir('/mnt/yocto-cache') else '${TOPDIR}/downloads'}"
    SSTATE_DIR ?= "${@'/mnt/yocto-cache/sstate-cache' if os.path.isdir('/mnt/yocto-cache') else '${TOPDIR}/sstate-cache'}"

# Environment variables kas forwards into the bitbake invocation. kas
# scrubs the shell env by default, so setting OE5XRX_RELEASE_TAG at the
# workflow level alone does nothing — it has to be listed here.
#
# Format: `NAME: default`. If the variable is set in the parent
# environment (e.g. by release.yml -> build.yml) that value wins; else
# the default below is used (covers local `kas build`).
env:
  OE5XRX_RELEASE_TAG: "dev"

target:
  - oe5xrx-remotestation-image
