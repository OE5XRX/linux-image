[pytest]
markers =
    unit: pure unit tests, no QEMU/root needed
    qemu: needs qemu-system-x86_64 + root (loop mount); run in CI or on a capable host
    sandbox: U-Boot sandbox boot-script tests; needs UBOOT_SANDBOX + CM4_BASE_DTB (CI job uboot-sandbox)
    rpi_artifact: checks against real rpi build artifacts (release gate); needs RPI_ARTIFACT_DIR
addopts = -ra
