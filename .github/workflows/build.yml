name: Build Yocto Image

# Full Yocto builds. Routine pushes go through ci.yml (parse checks only).
# Invoked either manually (workflow_dispatch) or as a reusable workflow
# from release.yml (workflow_call) — the latter builds both targets.
on:
  workflow_dispatch:
    inputs:
      machine:
        description: "Target machine"
        type: choice
        options:
          - qemux86-64
          - raspberrypi4-64
        default: qemux86-64
      release_tag:
        description: "Release tag for /etc/issue + /etc/os-release stamp (empty -> dev)"
        type: string
        default: ""
  workflow_call:
    inputs:
      machine:
        description: "Target machine"
        type: string
        required: true
      release_tag:
        description: "Release tag for /etc/issue + /etc/os-release stamp (empty -> dev)"
        type: string
        default: ""

concurrency:
  # Serialize per target — prevents two builds for the same machine from
  # stomping each other on the shared R2 mirror.
  group: yocto-build-${{ inputs.machine }}
  cancel-in-progress: false

env:
  KAS_MACHINE: ${{ inputs.machine }}
  OE5XRX_RELEASE_TAG: ${{ inputs.release_tag || 'dev' }}
  BUILDER_LABEL: oe5xrx-yocto-builder-${{ inputs.machine }}

jobs:
  create-runner:
    name: Create Hetzner Build Server
    runs-on: ubuntu-latest
    outputs:
      server-id: ${{ steps.create.outputs.server-id }}
    steps:
      - name: Validate machine input
        # workflow_dispatch has a choice enum; workflow_call only has
        # `type: string`. Fail fast here so a typo or new caller can't
        # reach `hcloud server create` before exploding on the missing
        # volume.
        env:
          MACHINE: ${{ inputs.machine }}
        run: |
          case "$MACHINE" in
            qemux86-64|raspberrypi4-64) ;;
            *)
              echo "::error::Unsupported machine '$MACHINE'. Must be qemux86-64 or raspberrypi4-64." >&2
              exit 1
              ;;
          esac

      - name: Generate Runner Registration Token via API
        id: runner-token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUNNER_TOKEN=$(curl -sX POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/actions/runners/registration-token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "::add-mask::${RUNNER_TOKEN}"
          echo "token=${RUNNER_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "IdentityFile ~/.ssh/hetzner" >> ~/.ssh/config

      - name: Install hcloud CLI
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/

      - name: Create Hetzner server (CCX43)
        id: create
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_SSH_KEY_NAME: ${{ secrets.HCLOUD_SSH_KEY_NAME }}
        run: |
          set -euo pipefail
          # Dedicated-vCPU CCX43: faster + more consistent than the cost-optimized
          # cx tier, and less exposed to its capacity crunch. Location is fixed to
          # fsn1 because the persistent cache volume is location-bound (no fallback).
          # Hetzner can still transiently reject placement (resource_unavailable), so
          # retry with exponential backoff before giving up.
          ATTEMPTS=5
          DELAY=30
          SERVER_ID=""
          err="$(mktemp)"
          for i in $(seq 1 "${ATTEMPTS}"); do
            echo "hcloud server create attempt ${i}/${ATTEMPTS} (ccx43 @ fsn1)..."
            if OUT=$(hcloud server create \
                  --name "${BUILDER_LABEL}" \
                  --type ccx43 \
                  --image ubuntu-24.04 \
                  --ssh-key "${HCLOUD_SSH_KEY_NAME}" \
                  --location fsn1 \
                  --output json 2>"${err}"); then
              SERVER_ID=$(printf '%s' "${OUT}" | python3 -c "import sys,json; print(json.load(sys.stdin)['server']['id'])")
              echo "Server created: ${SERVER_ID}"
              break
            fi
            echo "::warning::server create failed (attempt ${i}/${ATTEMPTS}): $(cat "${err}")"
            if [ "${i}" -lt "${ATTEMPTS}" ]; then
              echo "Retrying in ${DELAY}s (Hetzner capacity may free up)..."
              sleep "${DELAY}"
              DELAY=$(( DELAY * 2 ))
              [ "${DELAY}" -gt 300 ] && DELAY=300
            fi
          done
          if [ -z "${SERVER_ID}" ]; then
            echo "::error::Could not create ccx43 in fsn1 after ${ATTEMPTS} attempts (likely resource_unavailable). Re-run the job or retry later." >&2
            exit 1
          fi
          SERVER_IP=$(hcloud server ip "${SERVER_ID}")
          echo "server-id=${SERVER_ID}" >> "$GITHUB_OUTPUT"
          echo "SERVER_IP=${SERVER_IP}" >> "$GITHUB_ENV"
          echo "Server ${SERVER_ID} created at ${SERVER_IP}"

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 "root@${SERVER_IP}" true 2>/dev/null; then
              echo "SSH ready after ${i} attempts"
              exit 0
            fi
            sleep 10
          done
          echo "SSH did not become ready within 5 minutes" >&2
          exit 1

      - name: Install Yocto build dependencies
        run: |
          ssh "root@${SERVER_IP}" bash -s << 'EOF'
            set -euo pipefail
            # Fix Ubuntu 24.04 AppArmor restriction on user namespaces (required by Bitbake)
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              gawk wget git diffstat unzip texinfo gcc build-essential \
              chrpath socat cpio python3 python3-pip python3-pexpect \
              xz-utils debianutils iputils-ping python3-git python3-jinja2 \
              python3-subunit zstd liblz4-tool file locales libacl1
            locale-gen en_US.UTF-8
            pip3 install kas --break-system-packages
          EOF

      - name: Create yocto build user
        run: |
          ssh "root@${SERVER_IP}" bash -s << 'EOF'
            set -euo pipefail
            useradd -m -s /bin/bash yocto
            echo "yocto ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/yocto
          EOF

      - name: Install and start GitHub Actions Runner
        env:
          RUNNER_REG_TOKEN: ${{ steps.runner-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ssh "root@${SERVER_IP}" bash -s -- \
            "${BUILDER_LABEL}" "${RUNNER_REG_TOKEN}" "${GH_REPO}" << 'SETUP_SCRIPT'
            set -euo pipefail
            LABEL=$1; TOKEN=$2; REPO=$3

            mkdir -p /opt/actions-runner
            chown yocto:yocto /opt/actions-runner
            su - yocto -c "
              cd /opt/actions-runner
              RUNNER_VERSION=\$(curl -s https://api.github.com/repos/actions/runner/releases/latest \
                | python3 -c \"import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))\")
              curl -sL \"https://github.com/actions/runner/releases/download/v\${RUNNER_VERSION}/actions-runner-linux-x64-\${RUNNER_VERSION}.tar.gz\" | tar xz
              ./config.sh \
                --url \"https://github.com/${REPO}\" \
                --token \"${TOKEN}\" \
                --labels \"${LABEL}\" \
                --name \"${LABEL}\" \
                --ephemeral \
                --unattended
            "

            cat > /etc/systemd/system/gh-runner.service << 'UNIT'
          [Unit]
          Description=GitHub Actions Runner
          After=network-online.target
          [Service]
          Type=simple
          User=yocto
          WorkingDirectory=/opt/actions-runner
          ExecStart=/opt/actions-runner/run.sh
          [Install]
          WantedBy=multi-user.target
          UNIT
            systemctl daemon-reload
            systemctl start gh-runner
          SETUP_SCRIPT

          # Give the runner a moment to connect to GitHub
          sleep 10

  build:
    name: Build Yocto Image
    needs: create-runner
    runs-on: oe5xrx-yocto-builder-${{ inputs.machine }}
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v6

      - name: Build with Kas
        run: |
          # OE5XRX_RELEASE_TAG is listed in oe5xrx.yml's `env:` block, so
          # kas picks it up from this workflow's environment and forwards
          # it into bitbake. No BB_ENV_PASSTHROUGH_ADDITIONS dance needed.
          if [ "${KAS_MACHINE}" = "qemux86-64" ]; then
            kas build qemux86-64.yml
          elif [ "${KAS_MACHINE}" = "raspberrypi4-64" ]; then
            kas build raspberrypi4-64.yml
          fi

      - name: Publish sstate + downloads to R2 mirror
        # Best-effort: a Bitwarden hiccup or missing R2 creds must not fail the
        # build — publishing is not a gate, reads still work off the mirror.
        if: always()
        continue-on-error: true
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_SERVER_URL: ${{ secrets.BWS_SERVER_URL }}
          R2_ACCOUNT_ID: cef6b7278fa23b4970442ce3a1dfcb32
        run: |
          set -euo pipefail
          export BWS_SERVER_URL="${BWS_SERVER_URL:-https://vault.bitwarden.eu}"
          # Tools: jq + rclone (this ephemeral build box may lack them). yocto has sudo.
          command -v jq >/dev/null || sudo apt-get install -y --no-install-recommends jq
          command -v rclone >/dev/null || { curl -fsSL https://rclone.org/install.sh | sudo bash; }
          # bws (pinned + sha256, mirrors create-runner's fetch step)
          if ! command -v bws >/dev/null; then
            VER=0.5.0
            SHA=b9296341549d9ba6922da6692b24c4d81d14dc3992597d5a777692aee73b10b2
            curl -fsSL -o /tmp/bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${VER}/bws-x86_64-unknown-linux-gnu-${VER}.zip"
            echo "${SHA}  /tmp/bws.zip" | sha256sum -c -
            mkdir -p "$HOME/.local/bin"; unzip -o /tmp/bws.zip -d "$HOME/.local/bin"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          PID=$(bws project list -o json | jq -r '.[]|select(.name=="oe5xrx-yocto-cache")|.id')
          [ -n "$PID" ] || { echo "::error::bws project oe5xrx-yocto-cache not found"; exit 1; }
          S=$(bws secret list -p "$PID" -o json)
          R2_KEY=$(jq -r '.[]|select(.key=="R2_SSTATE_KEY")|.value' <<<"$S")
          R2_SECRET=$(jq -r '.[]|select(.key=="R2_SSTATE_SECRET")|.value' <<<"$S")
          [ -n "$R2_KEY" ] && [ -n "$R2_SECRET" ] || { echo "::error::R2_SSTATE_* missing in oe5xrx-yocto-cache"; exit 1; }
          echo "::add-mask::$R2_KEY"; echo "::add-mask::$R2_SECRET"
          export RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
                 RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_KEY" \
                 RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET" \
                 RCLONE_CONFIG_R2_REGION=auto \
                 RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Publish only new objects (rclone copy skips equal). A failed publish
          # warns but never fails the build — the public bucket is not a gate.
          rclone copy --transfers 16 --checkers 32 build/sstate-cache/ R2:oe5xrx-yocto-sstate/sstate || echo "::warning::sstate publish failed"
          [ -d build/downloads ] && rclone copy --transfers 16 --checkers 32 build/downloads/ R2:oe5xrx-yocto-sstate/downloads || echo "::warning::downloads publish skipped/failed"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Follow symlinks (-L) so we capture real kernel/rootfs files, not links.
          # Include rootfs (ext4/wic), kernel (bzImage/Image/zImage), device tree,
          # and qemuboot.conf (runqemu metadata — helpful for local boot).
          find -L build/tmp/deploy/images/ \
            \( -name "*.ext4" -o -name "*.wic" -o -name "*.wic.gz" \
               -o -name "*.wic.bz2" -o -name "*.wic.xz" \
               -o -name "bzImage-*" -o -name "Image-*" -o -name "zImage-*" \
               -o -name "*.qemuboot.conf" -o -name "*.dtb" \) \
            -not -name "*.p7" \
            | while read -r f; do cp -L "$f" artifacts/; done
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: yocto-image-${{ env.KAS_MACHINE }}
          path: artifacts/
          # Keep builds short — each Yocto artifact is ~420MB and we build
          # often. Org storage fills up fast otherwise.
          retention-days: 7

  cleanup:
    name: Delete Hetzner Server
    needs: [create-runner, build]
    runs-on: ubuntu-latest
    if: always()
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVER_ID: ${{ needs.create-runner.outputs.server-id }}
    steps:
      - name: Delete server
        run: |
          curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz
          sudo mv hcloud /usr/local/bin/
          if [ -n "${SERVER_ID}" ]; then
            hcloud server delete "${SERVER_ID}" || true
            echo "Server ${SERVER_ID} deleted"
          else
            echo "No server to delete"
          fi

      - name: Deregister runner (if still registered)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          RUNNER_LABEL: ${{ env.BUILDER_LABEL }}
        run: |
          # Find and remove the runner if it's still registered
          RUNNER_ID=$(curl -s \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/actions/runners" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for r in data.get('runners', []):
              if r['name'] == '${RUNNER_LABEL}':
                  print(r['id'])
                  break
          " 2>/dev/null || true)
          if [ -n "${RUNNER_ID}" ]; then
            curl -sX DELETE \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPO}/actions/runners/${RUNNER_ID}" || true
            echo "Runner ${RUNNER_LABEL} deregistered"
          fi
