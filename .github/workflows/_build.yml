name: Build Yocto Image

# Full Yocto builds on an on-demand Hetzner box driven over SSH via the ydev
# scripts (scripts/ydev/remote-*). The box arms its own cloud-init teardown
# (idle + max-life + self-heal) at boot; the explicit remote-down.sh below is
# the happy-path teardown, the cloud-init net catches run cancellation.
#
# REUSABLE BUILDING BLOCK (workflow_call only — no own trigger, hence the `_`
# filename prefix). Invoked by pr.yml (per PR) and release.yml (per tag). The
# PR path list that used to live here now lives in pr.yml, the single PR entry.
on:
  workflow_call:
    inputs:
      machine:
        description: "Target machine"
        type: string
        required: true
      release_tag:
        description: "Release tag for /etc/issue + /etc/os-release stamp (empty -> dev)"
        type: string
        default: ""
      dev_image:
        description: "Also build the dev-image target (fast-dev-loop) in the same invocation"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Group on the caller's ref (inherited under workflow_call — this is the ref
  # checkout runs against): refs/pull/<n>/merge for a PR gives per-PR isolation;
  # refs/tags/<tag> for a release gives per-tag isolation and never shares a
  # group with a PR build. Deliberately NOT keyed on github.event_name, which is
  # ambiguous under workflow_call — a tag build must never be cancelled.
  group: yocto-build-${{ inputs.machine }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  KAS_MACHINE: ${{ inputs.machine || 'qemux86-64' }}
  OE5XRX_RELEASE_TAG: ${{ inputs.release_tag || 'dev' }}
  # ydev CI config (shared-vCPU CPX; short idle + hard max-life self-teardown)
  YDEV_SERVER_TYPE: cpx62
  # Ordered datacenter fallback: Falkenstein (fsn1) regularly runs full, so
  # remote-up.sh tries the next EU location (all offer cpx62) rather than
  # failing the build. Use YDEV_LOCATIONS (plural), NOT YDEV_LOCATION — the
  # singular var pins ONE location and would disable the fallback.
  YDEV_LOCATIONS: fsn1 nbg1 hel1
  YDEV_IDLE_MINUTES: "10"
  YDEV_MAX_HOURS: "3"
  # Pinned for reproducibility; bump in one place. Not a github-action, so
  # dependabot won't touch it — refresh by hand when a new hcloud CLI ships.
  HCLOUD_CLI_VERSION: v1.67.0

jobs:
  build:
    name: Build Yocto Image
    runs-on: ubuntu-latest
    # Skip draft PRs — don't spin an (expensive) box for WIP pushes. For
    # dispatch/workflow_call there is no pull_request, so this is true.
    if: ${{ !github.event.pull_request.draft }}
    # Above the box's own YDEV_MAX_HOURS (=3h) so the box self-teardown is the
    # inner cap for a wedged build; +buffer for provisioning + download.
    timeout-minutes: 210
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_SSH_KEY_NAME: ${{ secrets.HCLOUD_SSH_KEY_NAME }}
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      BWS_SERVER_URL: ${{ secrets.BWS_SERVER_URL }}
      DEV_IMAGE: ${{ inputs.dev_image }}
      YDEV_SESSION_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.machine || 'qemux86-64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate machine input
        env:
          MACHINE: ${{ inputs.machine || 'qemux86-64' }}
        run: |
          case "$MACHINE" in
            qemux86-64|raspberrypi4-64) ;;
            *) echo "::error::Unsupported machine '$MACHINE'. Must be qemux86-64 or raspberrypi4-64." >&2; exit 1 ;;
          esac

      - name: Install hcloud + bws (+ jq/unzip)
        run: |
          set -euo pipefail
          # jq (used by remote-up.sh) + unzip (used below for bws) ship on
          # ubuntu-latest today, but install explicitly so a runner-image change
          # can't silently break provisioning.
          command -v jq >/dev/null && command -v unzip >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq unzip; }
          curl -fsSL "https://github.com/hetznercloud/cli/releases/download/${HCLOUD_CLI_VERSION}/hcloud-linux-amd64.tar.gz" | tar xz
          sudo mv hcloud /usr/local/bin/
          VER=0.5.0
          SHA=b9296341549d9ba6922da6692b24c4d81d14dc3992597d5a777692aee73b10b2
          curl -fsSL -o /tmp/bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${VER}/bws-x86_64-unknown-linux-gnu-${VER}.zip"
          echo "${SHA}  /tmp/bws.zip" | sha256sum -c -
          sudo unzip -o /tmp/bws.zip -d /usr/local/bin

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # printf, not echo: preserves the key bytes exactly (echo can mangle
          # escapes / drop the trailing newline across shells).
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          echo "HCLOUD_SSH_KEY=$HOME/.ssh/hetzner" >> "$GITHUB_ENV"

      - name: Provision on-demand build box
        run: bash scripts/ydev/remote-up.sh

      - name: Record build start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build with kas
        id: build
        run: |
          set -euo pipefail
          if [ "${DEV_IMAGE}" = "true" ]; then
            bash scripts/ydev/remote-build.sh "${KAS_MACHINE}" --both
          else
            bash scripts/ydev/remote-build.sh "${KAS_MACHINE}"
          fi

      - name: Download images
        run: bash scripts/ydev/remote-download.sh "${KAS_MACHINE}"

      - name: Verify dev-image wic built
        if: ${{ inputs.dev_image }}
        run: |
          set -euo pipefail
          wic=$(find "dist/${KAS_MACHINE}" -name 'oe5xrx-remotestation-dev-image-*.wic*' -print -quit)
          [ -n "${wic}" ] || { echo "::error::dev-image target produced no .wic"; exit 1; }
          echo "dev-image wic built: ${wic} ($(du -h "${wic}" | cut -f1))"

      - name: Collect prod-only artifacts
        run: bash scripts/ydev/ci-collect-prod-artifacts.sh "${KAS_MACHINE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yocto-image-${{ env.KAS_MACHINE }}
          path: artifacts/
          retention-days: 7

      - name: Collect dev artifacts
        if: ${{ inputs.dev_image }}
        run: bash scripts/ydev/ci-collect-dev-artifacts.sh "${KAS_MACHINE}"

      - name: Upload dev artifacts
        if: ${{ inputs.dev_image }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yocto-image-${{ env.KAS_MACHINE }}-dev
          path: artifacts-dev/
          retention-days: 7

      - name: Push build summary to Pushgateway
        if: always()
        env:
          SESSION: ${{ env.YDEV_SESSION_NAME }}
          SUCCESS: ${{ steps.build.outcome == 'success' && '1' || '0' }}
          REF: ${{ github.ref }}
          MACHINE: ${{ env.KAS_MACHINE }}
        run: |
          set -euo pipefail
          # bws defaults its server URL only when BWS_SERVER_URL is UNSET, not empty.
          # The job-level `BWS_SERVER_URL: ${{ secrets.BWS_SERVER_URL }}` passes through
          # as an empty string when that secret is unset, which breaks bws (project
          # lookup fails). Default it before any bws call — same guard as remote-up.sh.
          export BWS_SERVER_URL="${BWS_SERVER_URL:-https://vault.bitwarden.eu}"
          # bws-fetch CF Access creds (same project + idiom as remote-up.sh).
          # Guard the fetch so a transient bws/network/auth failure yields an empty
          # value + warning rather than aborting this always() step with a build error.
          PROJECT_ID=$(bws project list -o json 2>/dev/null | jq -r '.[]|select(.name=="oe5xrx-yocto-cache")|.id') || PROJECT_ID=""
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::pushgateway push failed: BW project oe5xrx-yocto-cache not found"
            exit 0
          fi
          SECRETS=$(bws secret list -p "$PROJECT_ID" -o json 2>/dev/null) || SECRETS=""
          CF_ACCESS_CLIENT_ID=$(jq -r '.[]|select(.key=="CF_ACCESS_CLIENT_ID")|.value' <<<"$SECRETS") || CF_ACCESS_CLIENT_ID=""
          CF_ACCESS_CLIENT_SECRET=$(jq -r '.[]|select(.key=="CF_ACCESS_CLIENT_SECRET")|.value' <<<"$SECRETS") || CF_ACCESS_CLIENT_SECRET=""
          # Mask immediately — bws values are NOT GitHub secrets, GH will not auto-mask.
          [ -n "$CF_ACCESS_CLIENT_ID" ] && echo "::add-mask::$CF_ACCESS_CLIENT_ID"
          [ -n "$CF_ACCESS_CLIENT_SECRET" ] && echo "::add-mask::$CF_ACCESS_CLIENT_SECRET"
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::warning::pushgateway push failed: CF_ACCESS_* not found in BW project"
            exit 0
          fi
          # Compute duration from BUILD_START recorded before the build step.
          # Use 0 (not epoch) when BUILD_START was never set (e.g. pre-build failure).
          if [ -n "${BUILD_START:-}" ]; then DURATION=$(( $(date +%s) - BUILD_START )); else DURATION=0; fi
          # IMAGE_BYTES: sum sizes of downloaded images under dist/<machine>/ (best-effort).
          IMAGE_BYTES=0
          if [ -d "dist/${MACHINE}" ]; then
            _img=$(find "dist/${MACHINE}" -maxdepth 1 -type f \
              \( -name "*.wic" -o -name "*.wic.gz" -o -name "*.wic.bz2" -o -name "*.wic.xz" \
                 -o -name "*.ext4" \) \
              -printf '%s\n' 2>/dev/null | awk '{s+=$1}END{print s+0}')
            IMAGE_BYTES="${_img:-0}"
          fi
          # SSTATE_HIT_RATIO: Yocto log lives on the box, not the runner — push 0.
          export CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          export SESSION SUCCESS DURATION REF MACHINE
          export IMAGE_BYTES SSTATE_HIT_RATIO=0
          bash scripts/ydev/box/build-summary.sh \
            || echo "::warning::pushgateway push failed (non-fatal)"

      - name: Teardown build box
        if: always()
        run: bash scripts/ydev/remote-down.sh
