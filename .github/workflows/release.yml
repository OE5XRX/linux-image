name: "Release · Step 2 · Build, Gate, Sign & Publish"

# ⚠️ DO NOT RENAME THIS FILE. `cosign sign-blob` derives its keyless identity
# from this workflow's path; station-manager pins
# `.../.github/workflows/release.yml@refs/tags/<tag>` when verifying images.
# Renaming release.yml would break signature verification for every station
# until station-manager's expected identity is updated in lockstep.
#
# Tag-triggered build / gate / sign / publish (Flow 2 of the two-step release).
#
# This workflow is DISPATCHED AGAINST A TAG REF by tag-release.yml
# (`gh workflow run release.yml --ref <tag>`). Because it then runs on the tag
# ref, `cosign sign-blob` produces the keyless identity
#   https://github.com/OE5XRX/linux-image/.github/workflows/release.yml@refs/tags/<tag>
# which is exactly what station-manager verifies against. (GITHUB_TOKEN-pushed
# tags do NOT trigger on:push — recursion guard — but workflow_dispatch is a
# documented GITHUB_TOKEN exception, so tag-release.yml dispatches us explicitly.)
#
# dry_run=true (dispatched manually on a BRANCH): build + gate only — skip the
# tag-format gate, signing, publishing and tag cleanup. Use it to validate the
# pipeline from a feature branch.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + gate only; do not validate-tag/sign/publish/cleanup"
        type: boolean
        default: false
      acknowledge_layout_change:
        description: "Acknowledge an intentional A/B slot-size change: the cross-build OTA gate can't pass against the old-layout release, so T2 skips instead of failing. Only for a release that deliberately changes the partition layout (needs a one-time fleet reflash)."
        type: boolean
        default: false

# Least privilege: default read-only (covers the build/gate reusable calls, the
# gh release list in resolve-slot-a, and same-run artifact downloads). The write
# and id-token scopes are granted only on the jobs that need them (release, cleanup).
permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag-format gate the operator asked for. Runs as a job ALWAYS so the
  # needs-chain stays intact in dry_run; the check itself is skipped on dry_run
  # (a manual branch dispatch has no tag ref). workflow_dispatch can be fired
  # against any ref, so the sign/publish path must only ever run for a
  # well-formed release tag.
  validate-tag:
    name: Validate tag / resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read    # only inspects github.ref and writes a job output
    outputs:
      release_tag: ${{ steps.rt.outputs.tag }}
    steps:
      - name: Require a well-formed tag ref
        if: ${{ !inputs.dry_run }}
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/*) : ;;
            *) echo "::error::a real release must run on a tag ref (dispatched by tag-release.yml), got '$REF'"; exit 1 ;;
          esac
          # Same TAG_RE as scripts/compute-release-version.sh — keep in sync.
          if ! printf '%s' "$REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{2}[a-z]?$'; then
            echo "::error::tag '$REF_NAME' is not a valid release tag (YYYY.MM.DD-HH[a-z])"
            exit 1
          fi
          echo "tag $REF_NAME OK"

      - name: Resolve the release tag used to stamp the image
        id: rt
        # Real run: the (validated) tag. dry_run: a branch ref_name may contain
        # '/' (e.g. feature/foo), which BitBake fatally rejects for
        # OE5XRX_RELEASE_TAG ([A-Za-z0-9._-] only). Stamp 'dev' instead — the same
        # dev-build stamp the image + boot-ota tests already recognise. Build and
        # gate both consume this, so expected_tag always matches the stamp.
        env:
          DRY: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$DRY" = "true" ]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: validate-tag
    uses: ./.github/workflows/_preflight.yml

  # Resolve the previous release (slot A for the gate's cross-build OTA test).
  # The current tag has no release yet (published at the end of this run), so the
  # latest existing release IS the previous one.
  resolve-slot-a:
    name: Resolve slot A (previous release)
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      last_release: ${{ steps.last.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: last
        uses: ./.github/actions/resolve-last-release
        with:
          repo: ${{ github.repository }}
          github-token: ${{ github.token }}

  build-x64:
    name: Build qemux86-64
    needs: [validate-tag, preflight]
    uses: ./.github/workflows/_build.yml
    with:
      machine: qemux86-64
      release_tag: ${{ needs.validate-tag.outputs.release_tag }}
      dev_image: true
    secrets: inherit

  build-rpi:
    name: Build raspberrypi4-64
    # Each target has its own cache volume, so the two builds run in parallel.
    needs: [validate-tag, preflight]
    uses: ./.github/workflows/_build.yml
    with:
      machine: raspberrypi4-64
      release_tag: ${{ needs.validate-tag.outputs.release_tag }}
      dev_image: true
    secrets: inherit

  gate:
    name: Boot & OTA gate (x64)
    # The publish gate: boot the freshly built x86 image and run the cross-build
    # OTA cycle (slot A = previous release). Publication depends on this passing.
    # expected_tag uses the SAME resolved tag the image was stamped with, so the
    # gate's version assertion matches in dry_run ('dev') as well as real runs.
    needs: [validate-tag, resolve-slot-a, build-x64]
    uses: ./.github/workflows/_boot-ota-test.yml
    with:
      machine: qemux86-64
      new_artifact: yocto-image-qemux86-64
      expected_tag: ${{ needs.validate-tag.outputs.release_tag }}
      last_release_tag: ${{ needs.resolve-slot-a.outputs.last_release }}
      ack_layout_change: ${{ inputs.acknowledge_layout_change }}
    secrets: inherit

  rpi-artifact-gate:
    name: Artifact gate (raspberrypi4-64)
    # Static + U-Boot-sandbox checks on the rpi wic the release job publishes
    # (tests/ota-integration/test_rpi_artifact.py, spec §7): stage 2 + our DT
    # overlays live in the slot rootfs (no test overlay / test fault), none on
    # the FAT, the FAT DTB takes the overlays, and the BUILT boot.scr +
    # boot-stage2.scr boot in the sandbox with oe5xrx.overlays=ok:<list>.
    # Runs in dry_run too. Publication depends on it.
    needs: [build-rpi]
    runs-on: ubuntu-latest
    # Sandbox build (cold ~10 min) + ~3 GiB wic decompress + tests.
    timeout-minutes: 60
    env:
      UBOOT_SANDBOX: ${{ github.workspace }}/.cache/uboot-sandbox
      RPI_ARTIFACT_DIR: ${{ github.workspace }}/rpi-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yocto-image-raspberrypi4-64
          path: rpi-artifact

      # Test deps + runtime lib of the cached tools/mkimage (libssl3t64);
      # the U-Boot build toolchain is installed below only on a cache miss.
      - name: Install test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdisk e2fsprogs device-tree-compiler mtools lbzip2 libssl3t64

      # ImageOS (e.g. ubuntu24) is a runner-machine env var, not part of the
      # `env` expression context — export it so the cache key below can use
      # it (a sandbox binary built on another runner image may not run).
      - name: Expose runner image for the cache key
        run: echo "ImageOS=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      # Same cache key as ci.yml job uboot-sandbox (shared build).
      - name: Cache U-Boot sandbox build
        id: uboot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Only what the tests need (binary, mkimage, stamp with the pinned
        # SHA) — not the ~0.5 GiB source/object tree. build-uboot-sandbox.sh
        # treats exactly this as "built". Paths + key MUST stay identical in
        # ci.yml and release.yml (the cache version hashes the path list).
        with:
          path: |
            .cache/uboot-sandbox/u-boot
            .cache/uboot-sandbox/tools/mkimage
            .cache/uboot-sandbox/.oe5xrx-sandbox-stamp
          key: uboot-sandbox-v2026.01-${{ hashFiles('scripts/build-uboot-sandbox.sh') }}-${{ runner.os }}-${{ env.ImageOS }}

      # The U-Boot build toolchain only on a cache miss. On a hit the
      # cached u-boot needs only libc and tools/mkimage only libssl3/
      # libcrypto3 (verified with ldd on ubuntu:24.04 without any -dev
      # package); the ImageOS in the cache key pins the runner image.
      - name: Install U-Boot build deps (cache miss only)
        if: steps.uboot-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libssl-dev libgnutls28-dev uuid-dev \
            python3-dev python3-setuptools swig pkg-config bc

      # Always run: on a cache hit it only checks the stamp (pinned version,
      # SHA, config) and exits without needing the toolchain.
      - name: Build U-Boot sandbox (v2026.01)
        run: scripts/build-uboot-sandbox.sh "$UBOOT_SANDBOX"

      # setup-python AFTER the U-Boot build (it needs the apt python3-dev;
      # see ci.yml uboot-sandbox).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: rpi artifact gate
        run: |
          ls -lh "$RPI_ARTIFACT_DIR"
          pip install --quiet -r tests/ota-integration/requirements.txt
          # Log which wic the gate checks (same pick order as the release job).
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tests/ota-integration")
          from rpi_artifact import pick_wic
          wic = pick_wic(Path(os.environ["RPI_ARTIFACT_DIR"]))
          print(f"rpi artifact gate: checking {wic.name} ({wic.stat().st_size} bytes)")
          PY
          python -m pytest tests/ota-integration -m rpi_artifact -v

  release:
    name: Sign & Publish Release
    needs: [validate-tag, build-x64, build-rpi, gate, rpi-artifact-gate]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the GitHub Release
      id-token: write   # cosign keyless OIDC token
      actions: read     # download build artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86-64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yocto-image-qemux86-64
          path: staging/qemux86-64

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yocto-image-raspberrypi4-64
          path: staging/raspberrypi4-64

      - name: Download x86-64 dev artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yocto-image-qemux86-64-dev
          path: staging-dev/qemux86-64

      - name: Download Raspberry Pi dev artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: yocto-image-raspberrypi4-64-dev
          path: staging-dev/raspberrypi4-64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package, checksum, sign
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release

          pick_wic() {  # $1 = staging dir; echoes "src ext" or empty
            local dir="$1" ext match
            for ext in wic.bz2 wic.xz wic.gz wic; do
              match=$(ls "${dir}"/*.${ext} 2>/dev/null | head -1 || true)
              if [ -n "${match}" ]; then echo "${match} ${ext}"; return 0; fi
            done
            return 1
          }

          for machine in qemux86-64 raspberrypi4-64; do
            # release channel ← prod staging ; dev channel ← dev staging
            for pair in "release:staging/${machine}" "dev:staging-dev/${machine}"; do
              channel="${pair%%:*}"
              dir="${pair##*:}"
              src=""; srcext=""
              read -r src srcext < <(pick_wic "${dir}" || true) || true
              if [ -z "${src:-}" ]; then
                echo "No ${channel} image artifact for ${machine}" >&2
                exit 1
              fi
              dest="release/oe5xrx-${machine}-${channel}-${TAG}.${srcext}"
              cp "${src}" "${dest}"
              (cd release && sha256sum "$(basename "${dest}")" > "$(basename "${dest}").sha256")
              cosign sign-blob --yes --bundle "${dest}.bundle" "${dest}"
            done
          done
          ls -lh release/

      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/oe5xrx-*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## OE5XRX Linux Image ${{ env.TAG }}

            Pre-built Yocto images for both supported targets. Published only
            after passing the boot + cross-build OTA integration gate.

            | Target | Release | Dev |
            |---|---|---|
            | Raspberry Pi CM4 | `oe5xrx-raspberrypi4-64-release-${{ env.TAG }}.wic.bz2` | `oe5xrx-raspberrypi4-64-dev-${{ env.TAG }}.wic.bz2` |
            | QEMU x86-64 | `oe5xrx-qemux86-64-release-${{ env.TAG }}.wic.bz2` | `oe5xrx-qemux86-64-dev-${{ env.TAG }}.wic.bz2` |

            Each image ships with a `.sha256` checksum and a `.bundle`
            cosign signature. Verification instructions are in
            [SECURITY.md](https://github.com/${{ env.REPO }}/blob/main/SECURITY.md).

  # A real release run creates no tag itself — the tag already exists (pushed by
  # tag-release.yml). If the build/gate/sign fails, delete that tag so a failed
  # attempt leaves nothing behind (mirrors the old "no tag until the gate passes"
  # property). To retry, re-dispatch tag-release.yml (it computes a fresh tag) —
  # a re-run of this workflow would target the now-deleted ref.
  cleanup:
    name: Delete tag on failure
    needs: [validate-tag, preflight, resolve-slot-a, build-x64, build-rpi, gate, rpi-artifact-gate, release]
    # Delete the tag ONLY when a real build/gate/sign job failed on a good tag —
    # never when validate-tag itself failed. A bare failure() can't express this:
    # per GitHub, "failure() returns true if any ANCESTOR job fails", and
    # validate-tag is a transitive ancestor via preflight — so failure() would
    # also fire for a malformed-tag manual dispatch and delete a tag this flow
    # never created. Explicit result checks (with always() so the if is still
    # evaluated) make it unambiguous: require validate-tag == success first.
    if: >-
      ${{ always() && !inputs.dry_run && startsWith(github.ref, 'refs/tags/')
          && needs.validate-tag.result == 'success'
          && (needs.preflight.result == 'failure'
              || needs.resolve-slot-a.result == 'failure'
              || needs.build-x64.result == 'failure'
              || needs.build-rpi.result == 'failure'
              || needs.gate.result == 'failure'
              || needs.rpi-artifact-gate.result == 'failure'
              || needs.release.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # delete the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only tolerate the "already gone" case; a real delete failure (missing
          # contents: write, a protected tag, a network error) must fail the job
          # rather than be swallowed, so a genuinely dangling tag is visible.
          if git ls-remote --exit-code --tags origin "refs/tags/${REF_NAME}" >/dev/null 2>&1; then
            echo "Release run failed — deleting tag '$REF_NAME' so nothing dangles"
            git push origin ":refs/tags/${REF_NAME}"
          else
            echo "tag '$REF_NAME' already gone — nothing to delete"
          fi
