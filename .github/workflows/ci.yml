name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: parse/lint/sim jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install kas + linters
        run: |
          pip install --quiet -r .github/requirements-kas.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck yamllint udev device-tree-compiler u-boot-tools

      - name: Verify kas configs parse (qemux86-64)
        run: kas dump qemux86-64.yml > /dev/null

      - name: Verify kas configs parse (raspberrypi4-64)
        run: kas dump raspberrypi4-64.yml > /dev/null

      - name: Lint shell scripts
        run: |
          find meta-oe5xrx-remotestation -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -e SC1091 -e SC2039
          # New scripts added by the boot/OTA test work (lint explicitly rather
          # than the whole scripts/ dir, which carries pre-existing intentional
          # warnings, e.g. run-qemu.sh's word-splitting ${CPU_FLAGS}).
          shellcheck -e SC1091 -e SC2039 \
            scripts/l0a-fstab-uuid-lint.sh \
            scripts/compute-release-version.sh \
            scripts/release.sh \
            scripts/build-uboot-sandbox.sh

      - name: Lint YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, comments-indentation: disable, indentation: {check-multi-line-strings: false}}}" \
            .github/workflows/ *.yml

      - name: Verify wks files have partitions
        run: |
          for wks in meta-oe5xrx-remotestation/files/wic/*.wks.in; do
            echo "Checking $wks..."
            grep -q '^part' "$wks" || { echo "  No partitions defined"; exit 1; }
          done

      - name: Verify udev slot rules syntax
        # udev is installed in the "Install kas + linters" step above.
        run: udevadm verify meta-oe5xrx-remotestation/recipes-core/oe5xrx-slot-udev/files/90-oe5xrx-slots.rules

      - name: L0a — static fstab UUID-mount guard
        # Fast counterpart to the L0b ROOTFS_POSTPROCESS assertion: flag any
        # wks --use-uuid mount without --no-fstab-update (the #37 bug class).
        run: scripts/l0a-fstab-uuid-lint.sh .

      - name: OTA-integration unit tests
        run: |
          pip install --quiet -r tests/ota-integration/requirements.txt
          python -m pytest tests/ota-integration -m unit -q

  uboot-sandbox:
    name: U-Boot sandbox boot-script tests (stage 1/2 + overlays)
    runs-on: ubuntu-latest
    env:
      UBOOT_SANDBOX: ${{ github.workspace }}/.cache/uboot-sandbox
      CM4_BASE_DTB: ${{ github.workspace }}/.cache/bcm2711-rpi-cm4.dtb
      # raspberrypi/firmware pin of the CM4 firmware DTB used as ${fdt_addr}.
      RPI_FW_REV: 6f0881cba8bea8ec24956a5718714730e9936ec5
      CM4_DTB_SHA256: dda5429988864e911304acae4c60c9866628bf8175fb6361ccbaceafedcd1c75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libssl-dev libgnutls28-dev uuid-dev \
            python3-dev python3-setuptools swig pkg-config bc \
            gdisk e2fsprogs device-tree-compiler

      # ImageOS (e.g. ubuntu24) is a runner-machine env var, not part of the
      # `env` expression context — export it so the cache key below can use
      # it (a sandbox binary built on another runner image may not run).
      - name: Expose runner image for the cache key
        run: echo "ImageOS=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache U-Boot sandbox build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uboot-sandbox
          key: uboot-sandbox-v2026.01-${{ hashFiles('scripts/build-uboot-sandbox.sh') }}-${{ runner.os }}-${{ env.ImageOS }}

      - name: Build U-Boot sandbox (v2026.01)
        run: scripts/build-uboot-sandbox.sh "$UBOOT_SANDBOX"

      - name: Fetch pinned CM4 firmware DTB
        run: |
          curl -fsSL --retry 3 -o "$CM4_BASE_DTB" \
            "https://raw.githubusercontent.com/raspberrypi/firmware/${RPI_FW_REV}/boot/bcm2711-rpi-cm4.dtb"
          echo "${CM4_DTB_SHA256}  ${CM4_BASE_DTB}" | sha256sum -c -

      # setup-python AFTER the U-Boot build: the build runs pylibfdt/binman
      # setup.py with `python3` and needs the apt python3-dev/-setuptools,
      # which a setup-python interpreter first on PATH would shadow.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sandbox boot tests
        run: |
          pip install --quiet -r tests/ota-integration/requirements.txt
          python -m pytest tests/ota-integration -m sandbox -q

  sim-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real-binary harness E2E
        run: bash tests/sim-harness/test_sim_harness.sh
      - name: Shellcheck harness + pin scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 -e SC2039 \
            meta-oe5xrx-remotestation/recipes-core/oe5xrx-sim-harness/files/sim-harness.sh \
            meta-oe5xrx-remotestation/recipes-core/oe5xrx-sim-harness/files/sim-audio.sh \
            tests/sim-harness/test_sim_harness.sh \
            tests/audio/audio_selfcheck.sh \
            tests/audio/agent_audio_selfcheck.sh \
            scripts/bump-fw-release.sh

  ydev-scripts:
    name: ydev scripts (lint + dry-run tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck ydev scripts
        # SC2015: intentional A && break || sleep retry idiom used across ydev scripts
        run: shellcheck -e SC1091 -e SC2039 -e SC2015 scripts/ydev/*.sh scripts/ydev/box/*.sh
      - name: Run ydev dry-run tests
        run: |
          set -euo pipefail
          for t in tests/ydev/test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

  # Folded in from the former dev-isolation.yml — same triggers (PR + push main),
  # kept as distinct jobs so their status lines stay recognisable.
  dev-isolation:
    name: Dev-only packages stay out of prod image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prod-safety lint
        run: bash scripts/l0-dev-packages-lint.sh

  audio-rdepends:
    name: Audio stack RDEPENDS complete (gst audiofx etc.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audio RDEPENDS lint
        run: bash scripts/l3-audio-rdepends-lint.sh

  ssh-hostkeys:
    name: SSH host keys persistent (/var/lib/ssh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SSH host-key lint
        run: bash scripts/l4-ssh-hostkeys-lint.sh

  image-variant:
    name: Image-variant marker wired in both recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image-variant marker lint
        run: bash scripts/l1-image-variant-lint.sh

  dev-launch:
    name: Dev-agent launcher fallback selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Launcher mount-vs-baked selection test
        run: bash tests/dev-loop/test_dev_launch.sh
